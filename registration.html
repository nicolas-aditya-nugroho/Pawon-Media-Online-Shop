    <main id="registration">
        <form action="login.html">
            <h2>Form Pendaftaran</h2>
            <div class="form-group fullname">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name">
            </div>
            <div class="form-group email">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="Enter your email address">
            </div>
            <div class="form-group password">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi Anda">
                <i id="pass-toggle-btn" class="fa-solid fa-eye"></i><br>
                <label for="password">Konfirmasi Password</label>
                <input type="password" id="password" placeholder="Enter your password">
                <i id="pass-toggle-btn" class="fa-solid fa-eye"></i>
            </div>
            <div class="form-group date">
                <label for="date">Tanggal Lahir</label>
                <input type="date" id="date" placeholder="Pilih Tanggal Lahir">
            </div>
            <div class="form-group gender">
                <label for="gender">Jenis Kelamin</label>
                <select id="gender">
                    <option value="" selected disabled>Pilih Jenis Kelamin</option>
                    <option value="Male">Pria</option>
                    <option value="Female">Wanita</option>
                </select>
            </div>
            <div class="form-group submit-btn">
                <a href="mailto:pawonmedia.010924@gmail.com"><input type="submit" value="Submit"></a>
            </div>
        </form>

        <script>// Selecting form and input elements
            const form = document.querySelector("form");
            const passwordInput = document.getElementById("password");
            const passToggleBtn = document.getElementById("pass-toggle-btn");
            // Function to display error messages
            const showError = (field, errorText) => {
                field.classList.add("error");
                const errorElement = document.createElement("small");
                errorElement.classList.add("error-text");
                errorElement.innerText = errorText;
                field.closest(".form-group").appendChild(errorElement);
            }
            // Function to handle form submission
            const handleFormData = (e) => {
                e.preventDefault();
                // Retrieving input elements
                const fullnameInput = document.getElementById("fullname");
                const emailInput = document.getElementById("email");
                const dateInput = document.getElementById("date");
                const genderInput = document.getElementById("gender");
                // Getting trimmed values from input fields
                const fullname = fullnameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const date = dateInput.value;
                const gender = genderInput.value;
                // Regular expression pattern for email validation
                const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
                // Clearing previous error messages
                document.querySelectorAll(".form-group .error").forEach(field => field.classList.remove("error"));
                document.querySelectorAll(".error-text").forEach(errorText => errorText.remove());
                // Performing validation checks
                if (fullname === "") {
                    showError(fullnameInput, "Masukkan nama lengkap Anda");
                }
                if (!emailPattern.test(email)) {
                    showError(emailInput, "Masukkan Email Anda dengan tepat!");
                }
                if (password === "") {
                    showError(passwordInput, "Masukkan Kata Sandi Anda dengan memasukkan kombinasi huruf dan angka");
                }
                if (date === "") {
                    showError(dateInput, "Pilih Tanggal Lahir Anda");
                }
                if (gender === "") {
                    showError(genderInput, "Pilih Jenis Kelamin Anda");
                }
                // Checking for any remaining errors before form submission
                const errorInputs = document.querySelectorAll(".form-group .error");
                if (errorInputs.length > 0) return;
                // Submitting the form
                form.submit();
            }
            // Toggling password visibility
            passToggleBtn.addEventListener('click', () => {
                passToggleBtn.className = passwordInput.type === "password" ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
                passwordInput.type = passwordInput.type === "password" ? "text" : "password";
            });
            // Handling form submission event
            form.addEventListener("submit", handleFormData);
        </script>
